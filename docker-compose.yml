services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: choralis-back-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - cff-network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: choralis-back-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - cff-network
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    container_name: choralis-back-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-choralis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_USER: ${DB_USERNAME:-choralis_user}
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - cff-network

  redis:
    image: redis:alpine
    container_name: choralis-back-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - cff-network

networks:
  cff-network:
    driver: bridge

volumes:
  db-data:
    driver: local
