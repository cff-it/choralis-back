services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cff-back-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - cff-network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: cff-back-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - cff-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: cff-back-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cff_back}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-cff_user}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - cff-network

  redis:
    image: redis:alpine
    container_name: cff-back-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - cff-network

networks:
  cff-network:
    driver: bridge

volumes:
  db-data:
    driver: local
